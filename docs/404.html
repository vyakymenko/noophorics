<style>
/* ---------------------------------------------------------------
   NOOPHORICS.ORG
   Typographic system: scholarly serif for prose, mono for quantities.
   Colour: plate + ink, with one accent — measurement red — reserved
   for phantom agreement, claimed values, and the annotator's mark.
   --------------------------------------------------------------- */

:root {
  color-scheme: light dark;

  --plate:        #e7e8e3;
  --field:        #ddded8;
  --ink:          #12161a;
  --graphite:     #5c6369;
  --rule:         #c5c7c0;
  --rule-soft:    #d5d6d0;
  --phantom:      #a3291d;
  --phantom-wash: rgba(163, 41, 29, 0.11);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter,
           "Bitstream Charter", "Book Antiqua", Georgia, "Times New Roman", serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, "DejaVu Sans Mono",
           "Liberation Mono", Consolas, monospace;

  --measure: 40rem;
  --rail: 11rem;
  --gutter: 3rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --plate:        #0f1317;
    --field:        #161b20;
    --ink:          #d7d9d4;
    --graphite:     #8c9299;
    --rule:         #262c32;
    --rule-soft:    #1d2329;
    --phantom:      #e0705f;
    --phantom-wash: rgba(224, 112, 95, 0.14);
  }
}

/* Explicit toggle must win over the media query, in both directions. */
:root[data-theme="dark"] {
  --plate:        #0f1317;
  --field:        #161b20;
  --ink:          #d7d9d4;
  --graphite:     #8c9299;
  --rule:         #262c32;
  --rule-soft:    #1d2329;
  --phantom:      #e0705f;
  --phantom-wash: rgba(224, 112, 95, 0.14);
}
:root[data-theme="light"] {
  --plate:        #e7e8e3;
  --field:        #ddded8;
  --ink:          #12161a;
  --graphite:     #5c6369;
  --rule:         #c5c7c0;
  --rule-soft:    #d5d6d0;
  --phantom:      #a3291d;
  --phantom-wash: rgba(163, 41, 29, 0.11);
}

/* ---- skip link ------------------------------------------------ */
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--accent);
  color:var(--plate);padding:.7rem 1.1rem;text-decoration:none;
  font:500 1rem/1 ui-monospace,Menlo,monospace}
.skip:focus{left:0}
main{display:block}

/* ---- base ---------------------------------------------------- */

body {
  background: var(--plate);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.62;
  -webkit-text-size-adjust: 100%;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }

a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: from-font;
  text-underline-offset: 0.18em;
  text-decoration-color: var(--phantom);
}
a:hover { color: var(--phantom); }

:focus-visible {
  outline: 2px solid var(--phantom);
  outline-offset: 3px;
}

em { font-style: italic; }
strong { font-weight: 600; }

/* ---- layout band --------------------------------------------- */

.band {
  display: grid;
  grid-template-columns:
    [rail] minmax(0, var(--rail))
    [text] minmax(0, var(--measure))
    [end];
  column-gap: var(--gutter);
  row-gap: 0;
  max-width: calc(var(--rail) + var(--gutter) + var(--measure) + 3rem);
  margin-inline: auto;
  padding-inline: 1.5rem;
}

.col  { grid-column: text; min-width: 0; }

/* ---- marginal rail ------------------------------------------- */

.rail {
  grid-column: rail;
  font-family: var(--mono);
  font-size: 0.6875rem;
  line-height: 1.6;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--graphite);
  text-align: right;
  padding-top: 0.55rem;
}
.rail b {
  display: block;
  font-weight: 400;
  color: var(--ink);
}
.rail .gloss {
  display: block;
  margin-top: 0.9rem;
  font-family: var(--serif);
  font-size: 0.8125rem;
  line-height: 1.45;
  letter-spacing: 0;
  text-transform: none;
  color: var(--graphite);
}
.rail .sym {
  display: block;
  margin-top: 0.7rem;
  font-size: 2.4rem;
  line-height: 1;
  letter-spacing: 0;
  color: var(--phantom);
}

/* ---- masthead ------------------------------------------------ */

.masthead {
  border-bottom: 1px solid var(--rule);
  padding-block: 0.9rem;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--graphite);
}
.masthead .band {
  grid-template-columns: 1fr auto;
  align-items: baseline;
  column-gap: 1.5rem;
}
.masthead .mark { color: var(--ink); }

/* ---- front matter -------------------------------------------- */

.front { padding-top: clamp(3rem, 8vw, 6rem); }

.eyebrow {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--graphite);
  margin-bottom: 1.4rem;
}

.wordmark {
  font-size: clamp(2.5rem, 10vw, 5.25rem);
  line-height: 0.98;
  letter-spacing: 0.015em;
  text-transform: uppercase;
}

.etym {
  margin-top: 1.1rem;
  font-family: var(--mono);
  font-size: 0.8125rem;
  letter-spacing: 0.02em;
  color: var(--graphite);
}

.deck {
  margin-top: 2.6rem;
  max-width: 34rem;
  font-size: clamp(1.15rem, 2.6vw, 1.4rem);
  line-height: 1.42;
}

.thesis {
  margin-top: 2.6rem;
  padding-top: 1.6rem;
  border-top: 1px solid var(--rule);
  font-size: clamp(1.3rem, 3.2vw, 1.75rem);
  line-height: 1.36;
}
.thesis .mark {
  text-decoration: underline;
  text-decoration-color: var(--phantom);
  text-decoration-thickness: 2px;
  text-underline-offset: 0.16em;
}
.thesis-src {
  margin-top: 1rem;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--graphite);
}

/* ---- metadata block ------------------------------------------ */

.meta {
  margin-top: 3rem;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding-block: 1.1rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: 1rem 1.5rem;
  font-family: var(--mono);
}
.meta div { display: flex; flex-direction: column; gap: 0.28rem; }
.meta dt {
  font-size: 0.625rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--graphite);
}
.meta dd {
  margin: 0;
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
}
.meta .zero { color: var(--phantom); }

/* ---- contents ------------------------------------------------ */

.contents { margin-top: 2.6rem; }
.contents ol { display: grid; gap: 0.1rem; }
.contents li {
  display: grid;
  grid-template-columns: 2.6rem 1fr;
  align-items: baseline;
  padding-block: 0.38rem;
  border-bottom: 1px solid var(--rule-soft);
}
.contents .n {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--graphite);
  font-variant-numeric: tabular-nums;
}
.contents a { text-decoration: none; }
.contents a:hover {
  text-decoration: underline;
  text-underline-offset: 0.18em;
}

/* ---- sections ------------------------------------------------ */

.sec { padding-top: clamp(3.5rem, 8vw, 6rem); }
.sec > .col > * + * { margin-top: 1.15rem; }

.sec h2 {
  font-size: clamp(1.5rem, 3.6vw, 2rem);
  line-height: 1.2;
  letter-spacing: 0.005em;
  padding-bottom: 0.7rem;
  border-bottom: 1px solid var(--rule);
}
.sec h3 {
  font-size: 1.0625rem;
  letter-spacing: 0.005em;
}
.sec .lead { font-size: 1.125rem; line-height: 1.5; }

.note {
  font-size: 0.9375rem;
  line-height: 1.55;
  color: var(--graphite);
}

/* ---- pull statement ------------------------------------------ */

.pull {
  margin-block: 2rem;
  padding: 1.5rem 0 1.5rem 1.6rem;
  border-left: 2px solid var(--phantom);
  font-size: clamp(1.15rem, 2.8vw, 1.45rem);
  line-height: 1.34;
}
.pull cite {
  display: block;
  margin-top: 0.9rem;
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-style: normal;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--graphite);
}

/* ---- generic mono bits --------------------------------------- */

.q {
  font-family: var(--mono);
  font-size: 0.92em;
  letter-spacing: -0.01em;
}
.tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.625rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--graphite);
  border: 1px solid var(--rule);
  padding: 0.14rem 0.42rem;
  white-space: nowrap;
}
.tag-alert { color: var(--phantom); border-color: var(--phantom); }

.scroll { overflow-x: auto; }

.formula {
  font-family: var(--mono);
  font-size: 0.8125rem;
  line-height: 1.7;
  white-space: pre;
  background: var(--field);
  border: 1px solid var(--rule);
  padding: 1.1rem 1.25rem;
  color: var(--ink);
}

/* ---- figures ------------------------------------------------- */

.figure {
  margin: 2.4rem 0 0;
  border: 1px solid var(--rule);
  background: var(--field);
}
/* plates break out of the measure into the marginal rail */
@media (min-width: 62rem) {
  .figure { margin-left: calc(-1 * (var(--rail) + var(--gutter))); }
}
.plate { overflow-x: auto; }
.figure svg { display: block; width: 100%; min-width: 32rem; height: auto; }
.figure figcaption {
  border-top: 1px solid var(--rule);
  padding: 0.9rem 1.1rem;
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--graphite);
}
.figure figcaption b {
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink);
  margin-right: 0.5rem;
}

.fig-line   { fill: none; stroke: var(--ink);      stroke-width: 2; }
.fig-line-p { fill: none; stroke: var(--phantom);  stroke-width: 2; }
.fig-gap    { fill: var(--phantom-wash); stroke: none; }
.fig-hatch  { stroke: var(--rule); stroke-width: 1; }
.fig-axis   { fill: none; stroke: var(--rule); stroke-width: 1; }
.fig-dash   { fill: none; stroke: var(--graphite); stroke-width: 1; stroke-dasharray: 4 5; }
.fig-box    { fill: none; stroke: var(--ink); stroke-width: 1.25; }
.fig-t      { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; fill: var(--graphite); }
.fig-t-ink  { fill: var(--ink); letter-spacing: 0.04em; }
.fig-t-p    { fill: var(--phantom); }
.fig-big    { font-family: var(--mono); font-size: 20px; fill: var(--ink); letter-spacing: 0; }
.fig-phi    { font-family: var(--mono); font-size: 34px; fill: var(--phantom); letter-spacing: 0; }

@media (prefers-reduced-motion: no-preference) {
  @keyframes trace { from { stroke-dasharray: 0 1400; } to { stroke-dasharray: 1400 0; } }
  @keyframes wash  { from { opacity: 0; } to { opacity: 1; } }
  .anim-a { animation: trace 1.5s cubic-bezier(.22,.61,.36,1) both; }
  .anim-b { animation: trace 1.5s cubic-bezier(.22,.61,.36,1) 0.25s both; }
  .anim-w { animation: wash 1.1s ease-out 1.2s both; }
}

/* ---- tables -------------------------------------------------- */

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 34rem;
  text-align: left;
}
caption {
  caption-side: top;
  text-align: left;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--graphite);
  padding-bottom: 0.7rem;
}
th {
  font-weight: 400;
  font-family: var(--mono);
  font-size: 0.625rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--graphite);
  border-bottom: 1px solid var(--rule);
  padding: 0 0.9rem 0.5rem 0;
  vertical-align: bottom;
}
td {
  border-bottom: 1px solid var(--rule-soft);
  padding: 0.75rem 0.9rem 0.75rem 0;
  vertical-align: baseline;
  font-size: 0.9375rem;
  line-height: 1.5;
}
th:last-child, td:last-child { padding-right: 0; }
.t-sym {
  font-family: var(--mono);
  font-size: 1.0625rem;
  white-space: nowrap;
  width: 5.5rem;
}
.t-name { width: 11rem; }
.t-name span {
  display: block;
  font-family: var(--mono);
  font-size: 0.625rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--graphite);
  margin-top: 0.2rem;
}
.hero-sym { color: var(--phantom); }

/* ---- law list ------------------------------------------------ */

.laws { margin-top: 2rem; display: grid; }
.law {
  display: grid;
  grid-template-columns: 3rem 1fr 7rem;
  align-items: baseline;
  gap: 0 1rem;
  padding-block: 0.85rem;
  border-top: 1px solid var(--rule-soft);
}
.law .tag { justify-self: end; }
.law:last-child { border-bottom: 1px solid var(--rule-soft); }
.law .id {
  font-family: var(--mono);
  font-size: 0.8125rem;
  color: var(--graphite);
}
.law .txt { font-size: 0.9375rem; line-height: 1.5; }
.law .txt i { color: var(--graphite); font-style: normal; }

.law-major {
  margin-top: 2.4rem;
  border-top: 2px solid var(--ink);
  padding-top: 1.3rem;
}
.law-major + .law-major { margin-top: 2.4rem; }
.law-major .hd {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 0.9rem;
  margin-bottom: 0.9rem;
}
.law-major .hd .id {
  font-family: var(--mono);
  font-size: 0.8125rem;
  letter-spacing: 0.08em;
  color: var(--phantom);
}
.law-major .hd h3 { font-size: 1.125rem; }
.law-major .claim {
  font-size: 1.0625rem;
  line-height: 1.45;
  padding-left: 1.1rem;
  border-left: 1px solid var(--rule);
}
.law-major p { margin-top: 0.95rem; }
.kill {
  margin-top: 0.95rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  line-height: 1.65;
  color: var(--graphite);
}
.kill b { color: var(--ink); font-weight: 400; }

/* ---- problem groups ------------------------------------------ */

.groups { margin-top: 1.8rem; display: grid; gap: 2.2rem; }
.group h3 {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--graphite);
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--rule);
}
.group p { margin-top: 0.7rem; }
.problems { margin-top: 0.9rem; display: grid; }
.problem {
  display: grid;
  grid-template-columns: 2.2rem 1fr;
  gap: 0 0.8rem;
  padding-block: 0.6rem;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 0.9375rem;
  line-height: 1.5;
}
.problem .n {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--graphite);
  font-variant-numeric: tabular-nums;
}
.problem b { font-weight: 600; }
.problem i { font-style: normal; color: var(--graphite); }

/* ---- experiment ledger --------------------------------------- */

.ledger { margin-top: 1.8rem; border-top: 1px solid var(--rule); }
.exp {
  padding-block: 1.05rem;
  border-bottom: 1px solid var(--rule-soft);
}
.exp .hd {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.45rem 0.9rem;
}
.exp .id {
  font-family: var(--mono);
  font-size: 0.8125rem;
  letter-spacing: 0.06em;
}
.exp .nm { font-size: 1rem; }
.exp .at {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  color: var(--graphite);
}
.exp p {
  margin-top: 0.5rem;
  font-size: 0.9375rem;
  line-height: 1.5;
  color: var(--graphite);
}
.exp p b { color: var(--ink); font-weight: 400; }

/* ---- falsifiers ---------------------------------------------- */

.falsifiers { margin-top: 1.4rem; display: grid; }
.falsifiers li {
  display: grid;
  grid-template-columns: 2.2rem 1fr;
  gap: 0 0.8rem;
  padding-block: 0.62rem;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 0.9375rem;
  line-height: 1.5;
}
.falsifiers li:first-child { border-top: 1px solid var(--rule-soft); }
.falsifiers .n {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--phantom);
}

/* ---- closing / footer ---------------------------------------- */

.closer {
  margin-top: 2.6rem;
  padding-top: 1.6rem;
  border-top: 2px solid var(--ink);
  font-size: clamp(1.25rem, 3vw, 1.6rem);
  line-height: 1.32;
}

.foot {
  margin-top: clamp(4rem, 9vw, 7rem);
  border-top: 1px solid var(--rule);
  padding-block: 2.2rem 4rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  line-height: 1.75;
  color: var(--graphite);
}
.foot .cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1.6rem 2rem;
}
.foot .cols > div { overflow-wrap: break-word; }
.foot h2 {
  margin: 0 0 0.5rem;
  font-weight: 400;
  font-size: 0.625rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}
.foot .cite {
  margin-top: 2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--serif);
  font-size: 0.875rem;
  line-height: 1.55;
  max-width: 34rem;
}

/* ---- narrow -------------------------------------------------- */

@media (max-width: 62rem) {
  .band {
    grid-template-columns: minmax(0, 1fr);
    max-width: 44rem;
  }
  .col, .rail { grid-column: 1; }
  .rail {
    text-align: left;
    padding-top: 0;
    padding-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.9rem;
  }
  .rail b { display: inline; }
  .rail .gloss, .rail .sym { display: none; }

}

@media (max-width: 34rem) {
  body { font-size: 1rem; }
  .law { grid-template-columns: 2.6rem 1fr; }
  .law .tag { grid-column: 2; justify-self: start; margin-top: 0.4rem; }
  .formula { font-size: 0.75rem; }
}
